<!--
  The tab mark: lucide's `train-front`, the same one the navbars and the footer
  use. App Router picks this up by filename and emits the <link rel="icon">.

  Two departures from how the icon is drawn in the app:

  - The stroke is heavier than lucide's 2. At the 16px a tab renders this at,
    a 2-unit stroke on a 24 grid lands near one physical pixel and greys out.
  - The colour is baked in rather than `currentColor`, which has nothing to
    inherit from out here. `prefers-color-scheme` follows the browser's own
    chrome — not next-themes, which can't reach the tab strip — so the mark
    stays legible against a dark tab bar and a light one.
-->
<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 24 24"
  fill="none"
  stroke="#1b1a1f"
  stroke-width="2.5"
  stroke-linecap="round"
  stroke-linejoin="round"
>
  <style>
    @media (prefers-color-scheme: dark) {
      svg { stroke: #f6f5f7; }
    }
  </style>
  <path d="M8 3.1V7a4 4 0 0 0 8 0V3.1" />
  <path d="m9 15-1-1" />
  <path d="m15 15 1-1" />
  <path d="M9 19c-2.8 0-5-2.2-5-5v-4a8 8 0 0 1 16 0v4c0 2.8-2.2 5-5 5Z" />
  <path d="m8 19-2 3" />
  <path d="m16 19 2 3" />
</svg>
